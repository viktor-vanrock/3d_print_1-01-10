# nginx vhost для api.dev.3mf.tech (reverse proxy → 127.0.0.1:3001). MF-541.
# Шаблон — Ops применяет на VDS вручную и добавляет TLS через certbot --nginx.

server {
    server_name api.dev.3mf.tech;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_domain 127.0.0.1 api.dev.3mf.tech;
    }

    listen 80;
}
