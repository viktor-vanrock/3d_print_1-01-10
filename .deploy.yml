.deploy_dev:
  extends: .kube_deploy
  stage: deploy
  tags: [kubernetes-std]
  variables:
    APP_NAMESPACE: d-rndml-aiportal
    CHART_DIR: "./helm"
    CHART_NAME: "."
    CHART_REPO: https://gitlab-ci-token:$CI_JOB_TOKEN@git.sberdevices.ru/rndml/devops/helm-template.git
    CHART_REF: "master"
    ENVIRONMENT: develop
    OC_SERVER: "https://api.advosd.sberdevices.ru:6443"
    OC_TOKEN: $OC_TOKEN
  # Выкатка на dev только по кнопке; сборка образов остаётся автоматической.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# 1 волна

deploy_dev_api:
  extends: .deploy_dev
  needs: [get_version, build_api]
  dependencies: [get_version, build_api]
  variables:
    APP_NAME: api
    VALUES_PATH: envs/dev/api.yaml

deploy_dev_web:
  extends: .deploy_dev
  needs: [get_version, build_web, deploy_dev_api]
  dependencies: [get_version, build_web]
  variables:
    APP_NAME: web
    VALUES_PATH: envs/dev/web.yaml

deploy_dev_relay:
  extends: .deploy_dev
  needs: [get_version, build_relay]
  dependencies: [get_version, build_relay]
  variables:
    APP_NAME: relay
    VALUES_PATH: envs/dev/relay.yaml

deploy_dev_search:
  extends: .deploy_dev
  needs: [get_version, build_search]
  dependencies: [get_version, build_search]
  variables:
    APP_NAME: search
    VALUES_PATH: envs/dev/search.yaml

deploy_dev_mesh:
  extends: .deploy_dev
  needs: [get_version, build_mesh]
  dependencies: [get_version, build_mesh]
  variables:
    APP_NAME: mesh
    VALUES_PATH: envs/dev/mesh.yaml

deploy_dev_giga:
  extends: .deploy_dev
  needs: [get_version, build_giga]
  dependencies: [get_version, build_giga]
  variables:
    APP_NAME: giga
    VALUES_PATH: envs/dev/giga.yaml

deploy_dev_giga_assistant_worker:
  extends: .deploy_dev
  needs: [get_version, build_giga, deploy_dev_api]
  dependencies: [get_version, build_giga]
  variables:
    APP_NAME: giga-assistant-worker
    VALUES_PATH: envs/dev/giga-assistant-worker.yaml

deploy_dev_scout:
  extends: .deploy_dev
  needs: [get_version, build_scout]
  dependencies: [get_version, build_scout]
  variables:
    APP_NAME: scout
    VALUES_PATH: envs/dev/scout.yaml

# ============================ prod (ветка main) ============================
.deploy_prod:
  extends: .kube_deploy
  stage: deploy
  tags: [p-deployer]
  variables:
    APP_NAMESPACE: p-rndml-aiportal
    CHART_DIR: "./helm"
    CHART_NAME: "."
    CHART_REPO: https://gitlab-ci-token:$CI_JOB_TOKEN@git.sberdevices.ru/rndml/devops/helm-template.git
    CHART_REF: "master"
    ENVIRONMENT: production
    URL: https://materialize.sberdevices.ru
    OC_SERVER: "https://api.advosp.sberdevices.ru:6443"
    OC_TOKEN: $OC_TOKEN
    # api тянет за собой pre-upgrade Job миграций ему нужно больше 15m по умолчанию.
    HELM_TIMEOUT: "20m0s"
  rules: !reference [.rules, prod_deploy]

deploy_prod_api:
  extends: .deploy_prod
  needs: [get_version, build_prod_api]
  dependencies: [get_version, build_prod_api]
  variables:
    APP_NAME: api
    VALUES_PATH: envs/prod/api.yaml

deploy_prod_web:
  extends: .deploy_prod
  needs: [get_version, build_prod_web, deploy_prod_api]
  dependencies: [get_version, build_prod_web]
  variables:
    APP_NAME: web
    VALUES_PATH: envs/prod/web.yaml

# 2 волна: внутренние сервисы. Независимы друг от друга, порядок любой.

deploy_prod_mesh:
  extends: .deploy_prod
  needs: [get_version, build_prod_mesh]
  dependencies: [get_version, build_prod_mesh]
  variables:
    APP_NAME: mesh
    VALUES_PATH: envs/prod/mesh.yaml

deploy_prod_giga:
  extends: .deploy_prod
  needs: [get_version, build_prod_giga]
  dependencies: [get_version, build_prod_giga]
  variables:
    APP_NAME: giga
    VALUES_PATH: envs/prod/giga.yaml

deploy_prod_relay:
  extends: .deploy_prod
  needs: [get_version, build_prod_relay]
  dependencies: [get_version, build_prod_relay]
  variables:
    APP_NAME: relay
    VALUES_PATH: envs/prod/relay.yaml

# 3 волна: воркеры. Включать после того, как в проде появятся данные для обработки.

deploy_prod_giga_assistant_worker:
  extends: .deploy_prod
  needs: [get_version, build_prod_giga, deploy_prod_api]
  dependencies: [get_version, build_prod_giga]
  variables:
    APP_NAME: giga-assistant-worker
    VALUES_PATH: envs/prod/giga-assistant-worker.yaml

deploy_prod_search:
  extends: .deploy_prod
  needs: [get_version, build_prod_search]
  dependencies: [get_version, build_prod_search]
  variables:
    APP_NAME: search
    VALUES_PATH: envs/prod/search.yaml

deploy_prod_scout:
  extends: .deploy_prod
  needs: [get_version, build_prod_scout]
  dependencies: [get_version, build_prod_scout]
  variables:
    APP_NAME: scout
    VALUES_PATH: envs/prod/scout.yaml
