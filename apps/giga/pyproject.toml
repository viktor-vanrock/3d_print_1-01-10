[project]
name = "giga"
version = "0.0.0"
description = "ИИ-слой: GigaChat (диагностика печати, семантический поиск, генерация профилей)"
requires-python = ">=3.12"
dependencies = [
    "portal-queue-lifecycle",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gigachat>=0.2.1",
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "trimesh>=4.5.0",
    "pillow>=12.3.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
portal-queue-lifecycle = { path = "../../packages/python/portal-queue-lifecycle" }

[project.scripts]
giga-worker = "giga.lifecycle_worker:run_loop"
giga-calendar-agent = "giga.calendar.run:main"
giga-catalog-agent = "giga.catalog.run:main"
giga-assistant-worker = "giga.assistant.lifecycle_worker:run_loop"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giga"]
