upstream aiportal-web {
  server web-d-rndml-aiportal.apps.advosd.sberdevices.ru:443;
}

upstream aiportal-api {
  server api-d-rndml-aiportal.apps.advosd.sberdevices.ru:443;
}

server {
  listen 80;
  server_name aiportal.dev.sberdevices.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name aiportal.dev.sberdevices.ru;
  client_max_body_size 0;
  proxy_buffering off;
  ssl_certificate /etc/nginx/ssl/bundle.crt;
  ssl_certificate_key /etc/nginx/ssl/private.key;
  root /usr/share/nginx/html;
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  location / {
      proxy_pass https://aiportal-web;
      proxy_set_header Host web-d-rndml-aiportal.apps.advosd.sberdevices.ru;
      proxy_set_header X-Forwarded-Host 'aiportal.dev.sberdevices.ru';
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      proxy_read_timeout 86400;
  }

  # Nest слушает /health, /auth, … без префикса /api — trailing slash на proxy_pass его снимает.
  location /api/ {
      proxy_pass https://aiportal-api/;
      proxy_set_header Host api-d-rndml-aiportal.apps.advosd.sberdevices.ru;
      proxy_set_header X-Forwarded-Host 'aiportal.dev.sberdevices.ru';
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      proxy_read_timeout 86400;
  }
}
