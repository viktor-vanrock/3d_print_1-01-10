# Шаблон moonraker.conf — MF-934, portal.ru/printer.firmware.template
#
# Наш агент (apps/device-agent) говорит с Klipper через это Moonraker API — не меняем контракт,
# только адрес/креды под конкретный образ.

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: ~/printer_data/comms/klippy.sock

[authorization]
# oneshot-токен для агента (apps/device-agent/readme.md § «Авторизация WS-хендшейка»).
# trusted_clients — ТОЛЬКО loopback/наш визуал на этом же устройстве, не открытая LAN-подсеть.
trusted_clients:
    127.0.0.1
cors_domains:
    *

[update_manager]
# Канал обновления нашего визуала/агента на устройстве — заполняет оператор при сборке образа
# (printer.support.md § «Кто собирает образ»), плейсхолдер здесь не боевой.
[update_manager printerface]
type: git_repo
path: <путь-к-visual-на-устройстве>
origin: <gitverse-url-визуала>
managed_services: printerface

[update_manager device-agent]
type: git_repo
path: <путь-к-агенту-на-устройстве>
origin: <gitverse-url-агента>
managed_services: device-agent
