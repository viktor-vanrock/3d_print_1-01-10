# 🔒 ЗАКРЫТАЯ РАЗРАБОТКА (docs/product/access.policy.md): гость без сессии -> окно входа.
# nginx vhost для dev.3mf.tech (SPA, ветка dev). MF-541 / MF-725 / MF-734 / MF-827.
# Шаблон — Ops применяет на VDS вручную и добавляет TLS через certbot --nginx.
#
# Проверка бот-меты (MF-827, задача 2): curl -sA TelegramBot https://dev.3mf.tech/project/<id>
# | grep og:title — компактный <head> от apps/api (`apps/api/src/seo/meta.ts`, MF-505),
# не пустой SPA-шелл.

# Бот-детект соцшеринга — см. nginx.3mf.tech.conf для полного объяснения. `map` — уровень
# http{}, не server{}.
map $http_user_agent $is_social_crawler {
    default 0;
    ~*(facebookexternalhit|Twitterbot|TelegramBot|Slackbot|LinkedInBot|WhatsApp|Discordbot|vkShare|Pinterest|SkypeUriPreview|Google-InspectionTool|Applebot) 1;
}

server {
    server_name dev.3mf.tech;

    # root — симлинк dist-live, не сам dist (MF-734): portal.deploy-dev.sh переключает
    # его одним rename на свежий релиз ПОСЛЕ успешного build, поэтому nginx никогда не
    # видит окно, когда каталог пуст/наполовину собран (раньше root смотрел прямо на
    # dist, который скрипт чистил перед каждой сборкой — отсюда 404 во время деплоя).
    root /home/plag/portal.ru-dev/apps/web/dist-live;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Легаси-маршрут идей: постоянный редирект на канонический /issue (MF-1797,
    # docs/epics/ideas.page.md §«Маршрут», директива MF-564). Regex-location — приоритет
    # выше `location /` ниже независимо от порядка в файле, так что редирект срабатывает
    # раньше SPA-фолбэка и auth-гейта. $is_args$args сохраняет query string (?tab=new и т.п.).
    # Клиентский migrateLegacyIdeasPath() в apps/web/src/router.ts остаётся как fallback —
    # не конфликтует, просто больше не увидит /ideas при прямых заходах и краулерах.
    location = /ideas {
        return 301 https://dev.3mf.tech/issue$is_args$args;
    }
    location ~ ^/ideas/(.+)$ {
        return 301 https://dev.3mf.tech/issue/$1$is_args$args;
    }

    # Umami-трекер same-origin (MF-725): /_a/script.js и /_a/api/send -> локальный
    # Umami (127.0.0.1:3400, стек ~/umami на этой же VDS). Website id dev.3mf.tech =
    # f33554f5-0758-4ee8-9778-a439f15ba309.
    location /_a/ {
        proxy_pass http://127.0.0.1:3400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Порт 3200, НЕ 3001 — на dev.3mf.tech api слушает 3200 (см. portal.api-dev.service,
    # 3100/3001 заняты Multica-инфраструктурой этой же VDS).
    location / {
        if ($cookie_portal_session = "") { return 302 https://api.dev.3mf.tech/auth/plagid/start; }
        if ($is_social_crawler) {
            proxy_pass http://127.0.0.1:3200/seo/meta?path=$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        if ($cookie_portal_session = "") { return 302 https://api.dev.3mf.tech/auth/plagid/start; }
        add_header Cache-Control "no-cache";
    }

    listen 80;
}
