# 🔒 ЗАКРЫТАЯ РАЗРАБОТКА (docs/product/access.policy.md): гость без сессии -> окно входа.
# Референс-vhost nginx для 3mf.tech (SPA apps/web/dist). MF-524, эпик MF-508.
#
# ⚠️ ВЛАДЕЛЕЦ ЖИВОГО КОНФИГА — Ops (VDS). Это ШАБЛОН/предложение в репо: live-конфиг на VDS
# правит и выкладывает Ops, не автодеплой. Файл не подхватывается ничем автоматически.
#
# ЗАЧЕМ (суть карточки): витрина «Проекты» переехала на публичный path-маршрут `/project`
# (и `/project/:id`). Чтобы deep-link и F5 работали при ПРЯМОМ заходе на `/project*`, nginx
# должен отдавать `index.html` на все не-файловые пути SPA (client-side routing). Раньше
# роутер был hash-based (`#/market`) и такого требования не было — теперь есть.
#
# КЛЮЧЕВАЯ СТРОКА — фолбэк на index.html:  try_files $uri $uri/ /index.html;
# Без неё `GET /project` вернёт 404 (нет такого файла на диске).
#
# TLS-блок (443, сертификаты, redirect 80→443) на VDS добавлен/управляется `certbot --nginx`
# (Let's Encrypt, docs/issues/008.vds.runtime.md) — здесь показан только смысловой минимум
# vhost'а. При выкладке Ops мёржит `location`-логику в существующий обслуживаемый certbot'ом
# server-блок, не заменяя TLS-обвязку целиком.
#
# Установка (Ops, на VDS):
#   1) вмёржить `map` (уровень http{}!) и location-блоки ниже в действующий server{} для
#      3mf.tech в /etc/nginx/...;
#   2) sudo nginx -t          # проверить синтаксис
#   3) sudo systemctl reload nginx
#   4) проверить снаружи (не с VDS):
#        curl -o /dev/null -w '%{http_code}\n' https://3mf.tech/            # 200
#        curl -o /dev/null -w '%{http_code}\n' https://3mf.tech/project     # 200 (НЕ 404) — тот же index.html
#        curl -o /dev/null -w '%{http_code}\n' https://3mf.tech/project/x   # 200 (НЕ 404)
#        curl -sA TelegramBot https://3mf.tech/project/<id> | grep og:title # компактный
#          <head> от apps/api (MF-827), не пустой SPA-шелл

# Бот-детект соцшеринга (MF-827, задача 2): мессенджеры/краулеры не исполняют JS — SPA
# index.html им ничего не покажет, превью в чате будет пустым. `map` — директива уровня
# http{}, не server{} — Ops добавляет её один раз рядом (или внутри) существующего http{}.
map $http_user_agent $is_social_crawler {
    default 0;
    ~*(facebookexternalhit|Twitterbot|TelegramBot|Slackbot|LinkedInBot|WhatsApp|Discordbot|vkShare|Pinterest|SkypeUriPreview|Google-InspectionTool|Applebot) 1;
}

server {
    server_name 3mf.tech;

    # root — симлинк dist-live, не сам dist (MF-734): portal.deploy.sh переключает его
    # одним rename на свежий релиз ПОСЛЕ успешного build+guard, поэтому nginx никогда
    # не видит окно, когда каталог пуст/наполовину собран (раньше root смотрел прямо на
    # dist, который скрипт чистил перед каждой сборкой — race, пойманный на dev-контуре).
    root /home/plag/portal.ru/apps/web/dist-live;
    index index.html;

    # Хешированные ассеты Vite (`assets/*.[hash].*`) — иммутабельны, кэшируем надолго.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Легаси-маршрут идей: постоянный редирект на канонический /issue (MF-1797,
    # docs/epics/ideas.page.md §«Маршрут», директива MF-564). Regex-location — приоритет
    # выше `location /` ниже независимо от порядка в файле, так что редирект срабатывает
    # раньше SPA-фолбэка и auth-гейта. $is_args$args сохраняет query string (?tab=new и т.п.).
    # Клиентский migrateLegacyIdeasPath() в apps/web/src/router.ts остаётся как fallback —
    # не конфликтует, просто больше не увидит /ideas при прямых заходах и краулерах.
    location = /ideas {
        return 301 https://3mf.tech/issue$is_args$args;
    }
    location ~ ^/ideas/(.+)$ {
        return 301 https://3mf.tech/issue/$1$is_args$args;
    }

    # Umami-трекер same-origin (MF-725): /_a/script.js и /_a/api/send -> Umami на
    # dev-VDS (Tailscale-only, 100.121.25.101:3400, стек ~/umami там же). Website id
    # 3mf.tech = ff13e9d7-944c-4c5b-a357-b70ea41dd7d4.
    location /_a/ {
        proxy_pass http://100.121.25.101:3400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-фолбэк: любой не-файловый путь (в т.ч. `/project`, `/project/:id`, `/u/:username`)
    # отдаёт index.html — дальше маршрутизирует клиентский роутер (apps/web/src/router.ts).
    # index.html не кэшируем, чтобы новый билд подхватывался сразу.
    #
    # `if` с единственным `proxy_pass` внутри — устоявшийся nginx-идиом «отдать боту
    # другой backend» (не тот произвольный `if` в location, от которого предостерегает
    # «if is evil»: здесь ровно одна директива, без вложенных условий/rewrite). apps/api
    # уже отдаёт компактный <head> с og-тегами по `path`-query (`apps/api/src/seo/meta.ts`,
    # MF-505) — этот location только маршрутизирует к нему ботов, обычные пользователи
    # идут в SPA как и раньше.
    location / {
        if ($cookie_portal_session = "") { return 302 https://api.3mf.tech/auth/plagid/start; }
        if ($is_social_crawler) {
            proxy_pass http://127.0.0.1:3000/seo/meta?path=$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        if ($cookie_portal_session = "") { return 302 https://api.3mf.tech/auth/plagid/start; }
        add_header Cache-Control "no-cache";
    }

    # listen 443 ssl; + ssl_certificate*/redirect 80→443 — управляется certbot --nginx на VDS.
    listen 80;
}
