# Шаблон printer.cfg — MF-934, portal.ru/printer.firmware.template
#
# Скопировано в новый git-репо под конкретную модель? Замени все плейсхолдеры <...> реальными
# значениями с реального железа (даташит платы / штатная калибровка), см. readme.md рядом.
# Не удаляй [include macros.cfg] — контракт агента (apps/device-agent/src/driver/printerDriver.ts)
# зовёт макросы из macros.cfg по имени.

[include macros.cfg]

[mcu]
# Путь serial у Klipper-платы модели (ls /dev/serial/by-id/*), НЕ /dev/ttyUSB0 (меняется при ребуте).
serial: <путь-к-serial-порту-платы>

[printer]
kinematics: <cartesian|corexy|delta>
max_velocity: <mm/s>
max_accel: <mm/s^2>
max_z_velocity: <mm/s>
max_z_accel: <mm/s^2>

[stepper_x]
step_pin: <пин>
dir_pin: <пин>
enable_pin: <пин>
microsteps: <шаг>
rotation_distance: <мм-за-оборот>
endstop_pin: <пин>
position_endstop: 0
position_max: <мм>
homing_speed: 50

[stepper_y]
step_pin: <пин>
dir_pin: <пин>
enable_pin: <пин>
microsteps: <шаг>
rotation_distance: <мм-за-оборот>
endstop_pin: <пин>
position_endstop: 0
position_max: <мм>
homing_speed: 50

[stepper_z]
step_pin: <пин>
dir_pin: <пин>
enable_pin: <пин>
microsteps: <шаг>
rotation_distance: <мм-за-оборот>
endstop_pin: <пин>
position_endstop: 0
position_max: <мм>

[extruder]
step_pin: <пин>
dir_pin: <пин>
enable_pin: <пин>
microsteps: <шаг>
rotation_distance: <мм-за-оборот-экструдера>
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: <пин>
sensor_type: <тип-термистора>
sensor_pin: <пин>
control: pid
pid_Kp: <калибровать-PID_CALIBRATE>
pid_Ki: <калибровать-PID_CALIBRATE>
pid_Kd: <калибровать-PID_CALIBRATE>
min_temp: 0
max_temp: <макс-темп-хотэнда>

[heater_bed]
heater_pin: <пин>
sensor_type: <тип-термистора>
sensor_pin: <пин>
control: pid
pid_Kp: <калибровать-PID_CALIBRATE>
pid_Ki: <калибровать-PID_CALIBRATE>
pid_Kd: <калибровать-PID_CALIBRATE>
min_temp: 0
max_temp: <макс-темп-стола>

[fan]
pin: <пин>

# Экран принтера — не штатный KlipperScreen: наш визуал (apps/web/src/printerface) в Chromium
# kiosk-режиме поверх Moonraker этого же printer.cfg (docs/design/printer.face.md §2.1).
# Настройка kiosk-браузера — часть образа оператора, не этого шаблона.

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]
