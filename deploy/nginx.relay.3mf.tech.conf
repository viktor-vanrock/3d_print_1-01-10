# L4 TLS passthrough for the compiled Nest relay gateway listener.
#
# This file belongs in nginx's top-level `stream {}` include, not sites-enabled/http{}.
# TLS MUST remain opaque here so apps/relay terminates mTLS itself and validates the
# individual gateway certificate. The relay hostname therefore needs a dedicated public
# 443 frontend (or an existing SNI stream router); do not terminate gateway TLS in an
# nginx `location` and do not forward client-certificate headers as identity.
#
# DEV template:
#   public relay.dev.3mf.tech:443 -> 127.0.0.1:3011 (RELAY_GATEWAY_PORT)
# PROD template:
#   public relay.3mf.tech:443     -> 127.0.0.1:8443 (RELAY_GATEWAY_PORT)
#
# The observability listener is deliberately absent from this public proxy. Prometheus
# scrapes http://127.0.0.1:3012/metrics on dev (9091 by default elsewhere); operators probe
# /health and /ready on that same loopback listener.

upstream portal_relay_gateway_tls {
    server 127.0.0.1:3011; # PROD: match RELAY_GATEWAY_PORT, default 8443
}

server {
    listen 443;
    proxy_connect_timeout 5s;
    proxy_timeout 120s;
    proxy_pass portal_relay_gateway_tls;
}
