# Фронтовый nginx для prod-контура в OpenShift (namespace p-rndml-aiportal).
upstream materialize-prod-web {
  server web-p-rndml-aiportal.apps.advosp.sberdevices.ru:443;
}

upstream materialize-prod-api {
  server api-p-rndml-aiportal.apps.advosp.sberdevices.ru:443;
}

server {
  listen 80;
  server_name materialize.sberdevices.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name materialize.sberdevices.ru;
  # 0 = без лимита: загрузка 3D-моделей идёт этим же путём.
  client_max_body_size 0;
  proxy_buffering off;
  ssl_certificate /etc/nginx/ssl/bundle.crt;
  ssl_certificate_key /etc/nginx/ssl/private.key;
  root /usr/share/nginx/html;

  location / {
      proxy_pass https://materialize-prod-web;
      proxy_set_header Host web-p-rndml-aiportal.apps.advosp.sberdevices.ru;
      proxy_set_header X-Forwarded-Host 'materialize.sberdevices.ru';
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      proxy_read_timeout 86400;
  }

  # Nest слушает /health, /auth, и тд без префикса /api trailing slash на proxy_pass его снимает.
  location /api/ {
      proxy_pass https://materialize-prod-api/;
      proxy_set_header Host api-p-rndml-aiportal.apps.advosp.sberdevices.ru;
      proxy_set_header X-Forwarded-Host 'materialize.sberdevices.ru';
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      proxy_read_timeout 86400;
  }
}
