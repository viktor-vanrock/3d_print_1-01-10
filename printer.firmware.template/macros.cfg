# Заготовки макросов — MF-934, portal.ru/printer.firmware.template
#
# Имена макросов ЗАФИКСИРОВАНЫ. PAUSE/RESUME/CANCEL_PRINT — стандартные Klipper-макросы, которые
# дёргает Moonraker в ответ на PrinterDriver.pause/resume/cancel нашего агента
# (apps/device-agent/src/driver/moonraker/moonrakerDriver.ts → printer.print.pause/resume/cancel).
# START_PRINT — конвенция слайсера: его вызывает ПЕРВАЯ строка G-code файла (start gcode в
# профиле слайсера должен содержать `START_PRINT BED_TEMP=... EXTRUDER_TEMP=...`), не агент
# напрямую — PrinterDriver.startPrint(fileName) лишь просит Moonraker начать печать файла
# (`printer.print.start`), а сам файл уже несёт вызов START_PRINT внутри. Переименовывать любое
# из имён нельзя, содержимое — под конкретную модель.

[gcode_macro START_PRINT]
description: Первая строка start-gcode слайсера (см. выше — не агент вызывает напрямую). Заполнить
             под модель: прогрев, home, авто-выравнивание стола, чистка сопла — что есть у железа.
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    G28
    # <калибровка-стола-если-есть: BED_MESH_CALIBRATE / QUAD_GANTRY_LEVEL>
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    # <очистка-сопла-если-есть>
    G90

[gcode_macro END_PRINT]
description: Вызывается агентом после успешного завершения печати.
gcode:
    M104 S0
    M140 S0
    G91
    G1 Z10 F600
    G90
    G28 X Y
    M84

[gcode_macro CANCEL_PRINT]
description: Вызывается агентом на cancel — контракт PrinterDriver.cancel().
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Вызывается агентом на pause — контракт PrinterDriver.pause().
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE

[gcode_macro RESUME]
description: Вызывается агентом на resume — контракт PrinterDriver.resume().
rename_existing: RESUME_BASE
gcode:
    RESUME_BASE
