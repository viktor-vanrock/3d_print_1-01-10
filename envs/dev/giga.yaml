# giga — HTTP API ИИ (порт 3102). Снаружи не публикуется, api ходит на http://giga:3102.

replicaCount: 1

image:
  repository: registry.sberdevices.ru/rndml/additive-ai-portal/3d-ai-portal/giga
  pullPolicy: IfNotPresent
  command: ["/bin/sh"]
  args:
    - "-c"
    - ". /vault/secrets/config && { uvicorn giga.main:app --host 0.0.0.0 --port 3102 & exec giga-worker; }"

imagePullSecrets:
  - name: gitlab-registry-secret

serviceAccount:
  create: false
  name: vault

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-pre-populate-only: "true"
  vault.hashicorp.com/agent-inject-secret-config: rndml/aiportal/giga
  vault.hashicorp.com/role: d-rndml-aiportal
  vault.hashicorp.com/agent-inject-template-config: |
    {{- with secret "rndml/aiportal/giga" -}}
    {{ range $k, $v := .Data.data }}export {{ $k }}='{{ $v }}'
    {{ end }}{{- end -}}

configMap:
  enabled: true
  config:
    S3_REGION: ru-moscow-1
    S3_BUCKET_GENERATIONS: d-rndml-aiportal
    S3_BUCKET_DIAGNOSTICS: d-rndml-aiportal
    GIGA_LIFECYCLE_ENABLED: "1"
    ASSISTANT_LIFECYCLE_ENABLED: "0"
    RUDALLE_API_URL: "https://rudalle-coordinator.dev.sberdevices.ru/api/"
    RUDALLE_TIMEOUT_SECONDS: "900"
    RUDALLE_MAX_RETRIES: "2"
    RUDALLE_RETRY_BACKOFF_SECONDS: "5.0"
    RUDALLE_POLL_INTERVAL_SECONDS: "10"
    RUDALLE_NUM_TARGET_FACES: "50000"

securityContext: {}
podSecurityContext: {}

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 3102
      protocol: TCP
      targetPort: 3102

ingress:
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
