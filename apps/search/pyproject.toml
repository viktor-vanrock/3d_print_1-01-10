[project]
name = "portal-search"
version = "0.0.0"
description = "Нейропоиск по форме модели (эмбеддинги геометрии + вектор-поиск). Владелец: AI."
requires-python = ">=3.12"
dependencies = [
    "portal-queue-lifecycle",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "trimesh>=4.5.0",
    "numpy>=2.1.0",
    "pillow>=12.3.0",
    "boto3>=1.35.0",
]

[tool.uv.sources]
portal-queue-lifecycle = { path = "../../packages/python/portal-queue-lifecycle" }

[project.scripts]
search-worker = "portal_search.lifecycle_worker:run_loop"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portal_search"]
