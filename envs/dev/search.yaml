# search — воркер очереди, HTTP нет, Route не создаётся.

replicaCount: 1

image:
  repository: registry.sberdevices.ru/rndml/additive-ai-portal/3d-ai-portal/search
  pullPolicy: IfNotPresent
  command: ["/bin/sh"]
  args: ["-c", ". /vault/secrets/config && exec search-worker"]

imagePullSecrets:
  - name: gitlab-registry-secret

serviceAccount:
  create: false
  name: vault

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-pre-populate-only: "true"
  vault.hashicorp.com/agent-inject-secret-config: rndml/aiportal/search
  vault.hashicorp.com/role: d-rndml-aiportal
  vault.hashicorp.com/agent-inject-template-config: |
    {{- with secret "rndml/aiportal/search" -}}
    {{ range $k, $v := .Data.data }}export {{ $k }}='{{ $v }}'
    {{ end }}{{- end -}}

configMap:
  enabled: true
  config:
    S3_REGION: ru-central-1
    S3_BUCKET_MODELS: p-rndml-aiportal
    SEARCH_LIFECYCLE_ENABLED: "0"

securityContext: {}
podSecurityContext: {}

service:
  enabled: false
  ports: []

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
